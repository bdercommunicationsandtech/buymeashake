<div class="flex h-screen w-full bg-slate-50 overflow-hidden font-sans text-slate-800">

  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm transition-opacity lg:hidden"
      (click)="closeSidebar()"
      aria-hidden="true">
    </div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col bg-slate-900 text-slate-300 transition-transform duration-300 ease-in-out lg:static lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()">

    <div class="flex h-16 shrink-0 items-center justify-between bg-slate-950/50 px-6">
      <a routerLink="/dashboard" class="flex items-center gap-3 transition-colors hover:text-white" (click)="closeSidebar()">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-blue-600 to-cyan-500 text-xs font-extrabold text-white">BMS</span>
        <span class="text-xl font-bold tracking-tight text-white">Admin</span>
      </a>
      <button type="button" class="rounded-lg p-1 text-slate-400 hover:bg-slate-800 hover:text-white lg:hidden" (click)="closeSidebar()" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-4 py-6 scrollbar-thin">
      <a routerLink="/dashboard"
         class="block rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white"
         routerLinkActive="bg-blue-600/10 text-blue-400 hover:bg-blue-600/20"
         (click)="closeSidebar()">Dashboard</a>
      <a routerLink="/users"
         class="block rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white"
         routerLinkActive="bg-blue-600/10 text-blue-400 hover:bg-blue-600/20"
         (click)="closeSidebar()">Usuarios</a>
      <a routerLink="/reports"
         class="block rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white"
         routerLinkActive="bg-blue-600/10 text-blue-400 hover:bg-blue-600/20"
         (click)="closeSidebar()">Reportes / Moderación</a>
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">

    <header class="z-10 flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4 shadow-sm sm:px-6 lg:px-8">

      <div class="flex items-center gap-4">
        <button type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-700 lg:hidden" (click)="toggleSidebar()" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <span class="hidden text-lg font-semibold text-slate-900 sm:block">BuyMeAShake Admin</span>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-3">
          <div class="relative flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-blue-600 text-sm font-bold text-white shadow-inner">
            <span>{{ (auth.user()?.first_name?.[0] || auth.user()?.email?.[0] || '?') | uppercase }}</span>
          </div>
          <div class="hidden flex-col md:flex">
            <span class="text-sm font-semibold text-slate-900">{{ auth.user()?.full_name || (auth.user()?.first_name + ' ' + auth.user()?.last_name) }}</span>
            <span class="text-xs text-slate-500">{{ auth.user()?.email }}</span>
          </div>
        </div>

        <div class="ml-2 h-8 w-px bg-slate-200 hidden sm:block"></div>
        <button type="button" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50 hover:text-red-600 focus:ring-2 focus:ring-red-500/20 focus:outline-none" (click)="auth.logout()">
          Salir
        </button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-slate-50 p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
