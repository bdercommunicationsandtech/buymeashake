<div class="min-h-screen bg-[#f7f7f8] dark:bg-[#090c0a] flex flex-col font-sans text-gray-900 dark:text-gray-100 transition-colors duration-200">
  <div class="flex-1 flex overflow-hidden">
    <aside class="w-60 bg-white dark:bg-[#111613] border-r border-gray-200/80 dark:border-white/10 flex flex-col shrink-0">
      <div class="h-16 flex items-center px-6">
        <a routerLink="/" class="flex items-center gap-2">
          <span class="grid h-9 w-9 place-items-center rounded-xl bg-[#c9ff3d] text-[#070a08] font-bold shadow-xs">
            <svg viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
              <rect x="12" y="4" width="8" height="4" rx="2" fill="currentColor" stroke="none" />
              <path d="M10 10h12l-1.4 16a4 4 0 0 1-4 3.6h-1.2a4 4 0 0 1-4-3.6z" />
              <path d="M11 20h10" stroke-linecap="round" />
            </svg>
          </span>
          <span class="text-base font-black tracking-tight text-gray-900 dark:text-white">
            buymeashake.fit
          </span>
        </a>
      </div>

      <nav class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5 text-xs font-semibold">
        <a
          routerLink="/supporter/home"
          routerLinkActive="bg-[#fff9e6] dark:bg-white/10 text-gray-950 dark:text-[#c9ff3d] font-bold border-l-3 border-[#f5b300]"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5 hover:text-gray-900 dark:hover:text-white transition"
        >
          <svg class="w-4 h-4 text-[#f5b300]" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          Inicio
        </a>

        <a
          routerLink="/explore"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5 hover:text-gray-900 dark:hover:text-white transition"
        >
          <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          Explorar atletas
        </a>
      </nav>

      <div class="p-4 border-t border-gray-200/80 dark:border-white/10">
        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5 transition"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header class="h-16 bg-white dark:bg-[#111613] border-b border-gray-200/80 dark:border-white/10 px-6 sm:px-10 flex items-center justify-between gap-3 sticky top-0 z-30">
        <p class="text-xs font-semibold text-gray-500 dark:text-gray-400">Panel de supporter</p>

        <div class="flex items-center gap-2 bg-gray-50 dark:bg-white/5 border border-gray-200/80 dark:border-white/10 rounded-full py-1 pl-1 pr-3">
          <div class="h-7 w-7 rounded-full bg-gray-900 text-[#c9ff3d] grid place-items-center text-[10px] font-black">
            {{ (auth.currentUser()?.full_name || 'U').slice(0, 2).toUpperCase() }}
          </div>
          <span class="text-xs font-bold text-gray-700 dark:text-gray-200">{{ auth.currentUser()?.full_name || 'Usuario' }}</span>
        </div>
      </header>

      <main class="flex-1 p-6 sm:p-10 max-w-5xl w-full mx-auto">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
