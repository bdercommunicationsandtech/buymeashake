<header class="glass-header sticky top-0 z-50">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    <a routerLink="/" class="flex items-center gap-2.5" (click)="closeMenu()">
      <span
        class="grid h-9 w-9 place-items-center rounded-xl bg-lime text-void shadow-[0_8px_20px_-8px_rgba(201,255,61,0.9)]"
      >
        <svg viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
          <rect x="12" y="4" width="8" height="4" rx="2" fill="currentColor" stroke="none" />
          <path d="M10 10h12l-1.4 16a4 4 0 0 1-4 3.6h-1.2a4 4 0 0 1-4-3.6z" />
          <path d="M11 20h10" stroke-linecap="round" />
        </svg>
      </span>
      <span class="text-[17px] font-extrabold tracking-tight text-white">
        buymeashake
      </span>
    </a>

    <nav class="hidden items-center gap-1 md:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-void! bg-lime!"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-full px-4 py-2 text-sm font-semibold text-white/65 transition hover:bg-white/8 hover:text-white"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <a
        routerLink="/auth/register"
        class="hidden rounded-full bg-lime px-5 py-2.5 text-sm font-bold text-void transition hover:brightness-110 sm:inline-flex"
      >
        Empieza gratis
      </a>

      <button
        type="button"
        class="grid h-10 w-10 place-items-center rounded-xl border border-white/12 text-white/75 md:hidden"
        (click)="toggleMenu()"
        aria-label="Abrir menú"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6L6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav class="border-t border-white/8 px-5 py-3 md:hidden">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          class="block rounded-xl px-3 py-2.5 text-sm font-semibold text-white/70 hover:bg-white/6 hover:text-white"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  }
</header>
