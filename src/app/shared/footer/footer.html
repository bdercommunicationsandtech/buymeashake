<footer class="border-t border-white/8 bg-void/80">
  <div class="mx-auto max-w-6xl px-5 py-14">
    <div class="grid gap-10 md:grid-cols-[1.4fr_1fr_1fr]">
      <div>
        <p class="text-lg font-extrabold tracking-tight text-white">
          buymeashake
        </p>
        <p class="mt-3 max-w-sm text-sm leading-relaxed text-white/45">
          {{ t().footer.tagline }}
        </p>
        <div class="mt-5 inline-flex items-center gap-2 rounded-full border border-white/10 px-3 py-1.5">
          <span class="h-2 w-2 rounded-full bg-lime"></span>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-white/50">
            buymeashake.fit
          </span>
        </div>
      </div>

      @for (column of columns(); track column.title) {
        <div>
          <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-white/35">
            {{ column.title }}
          </p>
          <ul class="mt-4 space-y-2.5">
            @for (link of column.links; track link.label) {
              <li>
                <a
                  [routerLink]="link.path"
                  class="text-sm text-white/60 transition hover:text-lime"
                >
                  {{ link.label }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div
      class="mt-12 flex flex-col gap-3 border-t border-white/8 pt-6 text-xs text-white/35 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
        <p>© {{ year }} buymeashake · {{ t().footer.rights }}</p>
        <button
          type="button"
          (click)="toggleLanguage()"
          class="inline-flex items-center gap-1.5 text-xs text-white/60 hover:text-lime transition cursor-pointer bg-transparent border-0 p-0"
        >
          <svg class="w-3.5 h-3.5 text-lime" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>{{ lang() === 'es' ? 'English (ENG)' : 'Español (ESP)' }}</span>
        </button>
      </div>
    </div>
  </div>
</footer>
