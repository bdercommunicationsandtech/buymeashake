<div class="mx-auto max-w-lg px-5 py-12">
  <h1 class="text-2xl font-black text-indigo-600 dark:text-indigo-500">Configura tu perfil</h1>
  <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Completa tu bio y precio de shake para que tus fans te encuentren.</p>

  @if (loading()) {
    <p class="mt-8 text-sm text-gray-500 dark:text-gray-400">Cargando…</p>
  } @else {
    <form class="mt-8 space-y-5" (ngSubmit)="saveAndContinue()">
      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">Nombre completo</label>
        <input class="block w-full rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#191c1d] px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-gray-900 dark:focus:border-[#c9ff3d] transition" [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" name="fullName" placeholder="Tu nombre" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">
          &#64;handle deportivo (tu enlace público: buymeashake.fit/{{ handle() || 'tu_handle' }})
        </label>
        @if (isSupporter()) {
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-sm text-gray-400 font-bold">&#64;</span>
            <input
              class="block w-full rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#191c1d] pl-9 pr-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-gray-900 dark:focus:border-[#c9ff3d] transition"
              [ngModel]="handle()"
              (ngModelChange)="handle.set($event)"
              name="handle"
              placeholder="tu_handle"
              required
            />
          </div>
          <p class="text-[11px] text-gray-500 dark:text-gray-500 mt-2">Solo letras minúsculas, números y guiones bajos (3-30 caracteres).</p>
        } @else {
          <input class="block w-full rounded-xl border border-gray-300 dark:border-white/15 bg-gray-50 dark:bg-white/5 px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none" [value]="handle()" readonly />
        }
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">Ciudad</label>
        <input class="block w-full rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#191c1d] px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-gray-900 dark:focus:border-[#c9ff3d] transition" [ngModel]="city()" (ngModelChange)="city.set($event)" name="city" />
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">Disciplina principal</label>
        <select class="block w-full rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#191c1d] px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-gray-900 dark:focus:border-[#c9ff3d] transition" [ngModel]="primarySportCode()" (ngModelChange)="primarySportCode.set(+$event)" name="sport">
          @for (sport of sports(); track sport.code) {
            <option [value]="sport.code" class="bg-white dark:bg-[#191c1d] text-gray-900 dark:text-white">{{ sport.label }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">Bio</label>
        <textarea class="block w-full rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#191c1d] px-4 py-3 text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-gray-900 dark:focus:border-[#c9ff3d] transition" rows="4" [ngModel]="bio()" (ngModelChange)="bio.set($event)" name="bio"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1.5">Precio por shake (USD)</label>
        <input type="number" min="1" class="block w-full rounded-xl border border-gray-300 dark:border-white/15 bg-white dark:bg-[#191c1d] px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-gray-900 dark:focus:border-[#c9ff3d] transition" [ngModel]="shakePrice()" (ngModelChange)="shakePrice.set(+$event)" name="shakePrice" />
      </div>

      @if (errorMessage()) {
        <div class="rounded-xl bg-red-50 dark:bg-red-950/40 p-3.5 border border-red-200 dark:border-red-900 text-xs font-bold text-red-600 dark:text-red-400">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" [disabled]="saving()" class="w-full flex justify-center rounded-xl bg-black dark:bg-black text-white py-3.5 px-4 text-sm font-bold shadow-sm border border-transparent dark:border-white/5 hover:bg-gray-900 focus:outline-none transition active:scale-[0.99] disabled:opacity-50 cursor-pointer">
        {{ saving() ? 'Guardando…' : 'Ir al dashboard' }}
      </button>
    </form>
  }

  <a routerLink="/dashboard/home" class="mt-6 block text-center text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">Omitir por ahora</a>
</div>
