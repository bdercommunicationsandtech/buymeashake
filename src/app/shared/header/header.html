<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 font-sans">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    
    <!-- Lado Izquierdo: Links secundarios -->
    <div class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-600">
      <a routerLink="/explore" class="hover:text-gray-900 transition">Explorar atletas</a>
      <a routerLink="/explore" class="hover:text-gray-900 transition flex items-center gap-1">
        <span>Top 10</span>
        <span class="text-[10px] font-black text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">En vivo</span>
      </a>
    </div>

    <!-- Centro: Logo Oficial -->
    <a routerLink="/" class="flex items-center gap-2.5" (click)="closeMenu()">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-[#c9ff3d] text-[#070a08] font-bold shadow-xs">
        <svg viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
          <rect x="12" y="4" width="8" height="4" rx="2" fill="currentColor" stroke="none" />
          <path d="M10 10h12l-1.4 16a4 4 0 0 1-4 3.6h-1.2a4 4 0 0 1-4-3.6z" />
          <path d="M11 20h10" stroke-linecap="round" />
        </svg>
      </span>
      <span class="text-lg font-black tracking-tight text-gray-900">
        buymeashake
      </span>
    </a>

    <!-- Lado Derecho: Buscador, Login y CTA -->
    <div class="flex items-center gap-3 sm:gap-4">
      
      <!-- Buscador rápido (Fiel a BMC) -->
      <div class="hidden lg:flex items-center relative">
        <input
          type="text"
          placeholder="Buscar atletas..."
          class="w-44 rounded-full bg-gray-50 hover:bg-gray-100 focus:bg-white border border-gray-200/80 pl-8 pr-3 py-1.5 text-xs text-gray-800 placeholder:text-gray-400 focus:border-gray-900 focus:w-56 focus:outline-none transition-all shadow-xs"
          [value]="searchQuery()"
          (input)="onSearch($any($event.target).value)"
          (keydown.enter)="submitSearch()"
        />
        <svg class="w-3.5 h-3.5 text-gray-400 absolute left-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- Iniciar Sesión -->
      <a
        routerLink="/auth/login"
        class="hidden sm:inline-block text-xs font-bold text-gray-700 hover:text-gray-950 transition px-2 py-1.5"
      >
        Iniciar sesión
      </a>

      <!-- Botón Principal Sign Up -->
      <a
        routerLink="/auth/register"
        class="rounded-full bg-[#c9ff3d] hover:bg-[#bbf033] px-4 sm:px-5 py-2 text-xs sm:text-sm font-black text-[#070a08] shadow-xs transition hover:shadow-sm active:scale-95 flex items-center gap-1.5"
      >
        <span>Crear mi página</span>
      </a>

      <!-- Botón Menú Mobile -->
      <button
        type="button"
        class="grid h-9 w-9 place-items-center rounded-xl border border-gray-200 text-gray-700 md:hidden"
        (click)="toggleMenu()"
        aria-label="Abrir menú"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6L6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Menú desplegable móvil -->
  @if (menuOpen()) {
    <nav class="border-t border-gray-100 bg-white px-5 py-4 space-y-2 md:hidden">
      <a
        routerLink="/explore"
        class="block rounded-xl px-3 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-50"
        (click)="closeMenu()"
      >
        Explorar atletas y Top 10
      </a>
      <a
        routerLink="/auth/login"
        class="block rounded-xl px-3 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-50"
        (click)="closeMenu()"
      >
        Iniciar sesión
      </a>
      <a
        routerLink="/auth/register"
        class="block rounded-xl bg-gray-900 text-[#c9ff3d] px-3 py-2.5 text-sm font-black text-center"
        (click)="closeMenu()"
      >
        Empezar ahora gratis
      </a>
    </nav>
  }
</header>
