<header class="sticky top-0 z-50 bg-white/95 dark:bg-[#090c0a]/95 backdrop-blur-md border-b border-gray-100 dark:border-white/10 font-sans transition-colors duration-200">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
    
    <!-- Lado Izquierdo: Links secundarios -->
    <div class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-600 dark:text-gray-300">
      <a routerLink="/explore" class="hover:text-gray-900 dark:hover:text-white transition">Explorar atletas</a>
      <a routerLink="/explore" class="hover:text-gray-900 dark:hover:text-white transition flex items-center gap-1">
        <span>Top 10</span>
        <span class="text-[10px] font-black text-amber-600 dark:text-[#c9ff3d] bg-amber-50 dark:bg-white/10 px-1.5 py-0.5 rounded">En vivo</span>
      </a>
    </div>

    <!-- Centro: Logo Oficial -->
    <a routerLink="/" class="flex items-center gap-2.5" (click)="closeMenu()">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-[#c9ff3d] text-[#070a08] font-bold shadow-xs">
        <svg viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
          <rect x="12" y="4" width="8" height="4" rx="2" fill="currentColor" stroke="none" />
          <path d="M10 10h12l-1.4 16a4 4 0 0 1-4 3.6h-1.2a4 4 0 0 1-4-3.6z" />
          <path d="M11 20h10" stroke-linecap="round" />
        </svg>
      </span>
      <span class="text-lg font-black tracking-tight text-gray-900 dark:text-white">
        buymeashake.fit
      </span>
    </a>

    <!-- Lado Derecho: Buscador, Theme Toggle, Login y CTA -->
    <div class="flex items-center gap-2.5 sm:gap-4">
      
      <!-- Botón Toggle Modo Claro / Oscuro -->
      <button
        type="button"
        (click)="themeService.toggleTheme()"
        class="h-9 w-9 rounded-xl border border-gray-200 dark:border-white/15 bg-gray-50 dark:bg-white/5 text-gray-700 dark:text-gray-200 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-white/10 transition shadow-xs"
        aria-label="Cambiar tema"
      >
        @if (themeService.currentTheme() === 'dark') {
          <!-- Sol (para pasar a claro) -->
          <svg class="w-4 h-4 text-[#c9ff3d]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        } @else {
          <!-- Luna (para pasar a oscuro) -->
          <svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        }
      </button>

      <!-- Iniciar Sesión -->
      <a
        routerLink="/auth/login"
        class="hidden sm:inline-block text-xs font-bold text-gray-700 dark:text-gray-300 hover:text-gray-950 dark:hover:text-white transition px-2 py-1.5"
      >
        Iniciar sesión
      </a>

      <!-- Botón Principal Sign Up -->
      <a
        routerLink="/auth/register"
        class="rounded-full bg-[#c9ff3d] hover:bg-[#bbf033] px-4 sm:px-5 py-2 text-xs sm:text-sm font-black text-[#070a08] shadow-xs transition hover:shadow-sm active:scale-95 flex items-center gap-1.5"
      >
        <span>Crear mi página</span>
      </a>

      <!-- Botón Menú Mobile -->
      <button
        type="button"
        class="grid h-9 w-9 place-items-center rounded-xl border border-gray-200 text-gray-700 md:hidden"
        (click)="toggleMenu()"
        aria-label="Abrir menú"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6L6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Menú desplegable móvil -->
  @if (menuOpen()) {
    <nav class="border-t border-gray-100 bg-white px-5 py-4 space-y-2 md:hidden">
      <a
        routerLink="/explore"
        class="block rounded-xl px-3 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-50"
        (click)="closeMenu()"
      >
        Explorar atletas y Top 10
      </a>
      <a
        routerLink="/auth/login"
        class="block rounded-xl px-3 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-50"
        (click)="closeMenu()"
      >
        Iniciar sesión
      </a>
      <a
        routerLink="/auth/register"
        class="block rounded-xl bg-gray-900 text-[#c9ff3d] px-3 py-2.5 text-sm font-black text-center"
        (click)="closeMenu()"
      >
        Empezar ahora gratis
      </a>
    </nav>
  }
</header>
