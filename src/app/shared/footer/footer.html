<footer class="border-t border-gray-200/80 dark:border-white/8 bg-white dark:bg-void/80 transition-colors duration-200">
  <div class="mx-auto max-w-6xl px-5 py-14">
    <div class="grid gap-10 sm:grid-cols-2 md:grid-cols-[1.3fr_1fr_1fr_1fr]">
      <div>
        <app-brand-logo
          [link]="null"
          [showIcon]="false"
          titleClass="h-6"
        />
        <p class="mt-3 max-w-sm text-sm leading-relaxed text-gray-500 dark:text-white/45">
          {{ t().footer.tagline }}
        </p>
        <div class="mt-5 inline-flex items-center gap-2 rounded-full border border-gray-200 dark:border-white/10 px-3 py-1.5">
          <span class="h-2 w-2 rounded-full bg-lime"></span>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 dark:text-white/50">
            buymeashake.fit
          </span>
        </div>
      </div>

      @for (column of columns(); track column.title) {
        <div>
          <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-gray-400 dark:text-white/35">
            {{ column.title }}
          </p>
          <ul class="mt-4 space-y-2.5">
            @for (link of column.links; track link.label) {
              <li>
                <a
                  [routerLink]="link.path"
                  class="text-sm text-gray-600 dark:text-white/60 transition hover:text-emerald-600 dark:hover:text-lime"
                >
                  {{ link.label }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div
      class="mt-12 flex flex-col gap-3 border-t border-gray-200/80 dark:border-white/8 pt-6 text-xs text-gray-400 dark:text-white/35 sm:flex-row sm:items-center sm:justify-between"
    >
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
        <p>© {{ year }} buymeashake · {{ t().footer.rights }}</p>
        <app-chrome-controls size="sm" />
      </div>
    </div>
  </div>
</footer>
